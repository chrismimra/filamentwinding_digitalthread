name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v9

      - run: uv sync --locked

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run pytest