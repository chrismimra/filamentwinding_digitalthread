[project]
name = "digital-thread-integration"
version = "0.1.0"
description = "Research software for digital thread integration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter",
    "ipykernel",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "open3d>=0.20.0",  # ray casting for the run geometry (Mapping)
    "scipy>=1.18.1",  # connected regions of the measured tow (Tow matching)
    "opencv-python>=4.10",  # calibration (slice 2)
    "gmsh>=4.15.2",  # STEP import of the mandrel (slice 2)
    "pyside6>=6.8",
    "pypylon>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_thread"]

[tool.ruff]
# The notebook is human-authored reference code and is not auto-formatted.
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["camera: needs a connected Basler camera (skipped otherwise)"]
